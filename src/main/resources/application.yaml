spring:
  application:
    name: smart-farming-api

  datasource:
    url: jdbc:postgresql://localhost:5432/smart_farming_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 900000
    refresh-expiration-days: 7
  cors:
    # Origens do frontend permitidas, separadas por vírgula (sem '*').
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  login:
    max-tentativas: 5            # falhas por e-mail + IP antes de bloquear
    max-tentativas-por-ip: 20    # falhas por IP (qualquer e-mail) antes de bloquear
    janela-minutos: 15           # período em que as falhas são contadas
    bloqueio-minutos: 15         # duração do bloqueio
  admin:
    nome: ${ADMIN_NOME:Administrador}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
