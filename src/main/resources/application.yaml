server:
  # Atrás do frontend (BFF) ou de um proxy reverso, o IP do usuário vem em X-Forwarded-For. Com "native" o Tomcat
  # só confia nesse cabeçalho quando a conexão vem de um proxy interno (loopback e redes privadas por padrão;
  # ajuste com SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES). O limite de tentativas de login usa esse IP.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

spring:
  application:
    name: smart-farming-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smart_farming_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 900000
    refresh-expiration-days: 7
  cors:
    # Origens do frontend permitidas, separadas por vírgula (sem '*').
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  login:
    max-tentativas: 5            # falhas por e-mail + IP antes de bloquear
    max-tentativas-por-ip: 20    # falhas por IP (qualquer e-mail) antes de bloquear
    janela-minutos: 15           # período em que as falhas são contadas
    bloqueio-minutos: 15         # duração do bloqueio
  previsao:
    # Open-Meteo: uso gratuito apenas não comercial; licença CC BY 4.0 (exige atribuição).
    url: ${PREVISAO_URL:https://api.open-meteo.com/v1/forecast}
    timeout-segundos: 10
    dias: 7                       # dias de previsão (1 a 16)
    validade-horas: 12            # depois disso a previsão é marcada como DESATUALIZADA
    atualizacao-automatica: ${PREVISAO_ATUALIZACAO_AUTOMATICA:true}
    atualizacao-minutos: 180      # intervalo do job que atualiza todas as fazendas com coordenadas
    intervalo-minimo-manual-minutos: 5   # evita chamadas seguidas pelo endpoint de atualização
  estacao:
    # Estação virtual: leituras horárias (EXTERNA) do Open-Meteo para as coordenadas da fazenda.
    atualizacao-automatica: ${ESTACAO_ATUALIZACAO_AUTOMATICA:true}
    atualizacao-minutos: 60
    historico-inicial-horas: 72          # histórico carregado quando a estação é criada
    recuperacao-maxima-horas: 168        # lacunas maiores que isto não são recuperadas
    intervalo-minimo-manual-minutos: 5   # evita chamadas seguidas pelo endpoint de sincronização
  alertas:
    avaliacao-automatica: ${ALERTAS_AVALIACAO_AUTOMATICA:true}
    avaliacao-minutos: 15        # intervalo do job que avalia as regras de todas as fazendas
    reabertura-horas: 6          # espera para reabrir um alerta fechado, salvo criticidade maior
  irrigacao:
    # Parâmetros de demonstração, não validados por agrônomo.
    calculo-automatico: ${IRRIGACAO_CALCULO_AUTOMATICO:true}
    calculo-minutos: 180         # intervalo do job que recalcula as recomendações de todas as fazendas
    validade-horas: 6            # depois disso a recomendação vence e uma nova é gravada
    janela-umidade-horas: 3      # janela da média de umidade do solo
    eficiencia-chuva: 0.8        # fração da chuva prevista considerada efetiva
    temperatura-alta-c: 35       # máxima prevista a partir da qual a demanda aumenta
    acrescimo-temperatura: 0.2   # aumento da demanda (20 %) em dias quentes
    volume-maximo-mm: 30         # teto por aplicação (acima disso, sugere parcelar)
  monitoramento:
    # Critério provisório: sensor ATIVO sem leitura há mais que isto conta como "sem leitura recente".
    sensor-sem-leitura-minutos: ${SENSOR_SEM_LEITURA_MINUTOS:30}
  simulador:
    # Gera leituras SIMULADAS para os sensores ativos. Desligado por padrão.
    enabled: ${SIMULADOR_ENABLED:false}
    intervalo-segundos: ${SIMULADOR_INTERVALO_SEGUNDOS:60}
    # Histórico retroativo gerado para sensores ativos que ainda não têm leituras (0 desliga).
    historico-horas: ${SIMULADOR_HISTORICO_HORAS:72}
    historico-intervalo-minutos: ${SIMULADOR_HISTORICO_INTERVALO_MINUTOS:15}
  demo:
    # Carrega dados de demonstração na subida (usuários, fazendas, leituras, alertas...). Não use em produção.
    enabled: ${DEMO_DADOS_ENABLED:false}
    password: ${DEMO_SENHA:}     # senha dos usuários de demonstração (mínimo de 8 caracteres)
  admin:
    nome: ${ADMIN_NOME:Administrador}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
