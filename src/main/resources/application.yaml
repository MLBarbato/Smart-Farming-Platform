spring:
  application:
    name: smart-farming-api

  datasource:
    url: jdbc:postgresql://localhost:5432/smart_farming_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 900000
    refresh-expiration-days: 7
  cors:
    # Origens do frontend permitidas, separadas por vírgula (sem '*').
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  login:
    max-tentativas: 5            # falhas por e-mail + IP antes de bloquear
    max-tentativas-por-ip: 20    # falhas por IP (qualquer e-mail) antes de bloquear
    janela-minutos: 15           # período em que as falhas são contadas
    bloqueio-minutos: 15         # duração do bloqueio
  previsao:
    # Open-Meteo: uso gratuito apenas não comercial; licença CC BY 4.0 (exige atribuição).
    url: ${PREVISAO_URL:https://api.open-meteo.com/v1/forecast}
    timeout-segundos: 10
    dias: 7                       # dias de previsão (1 a 16)
    validade-horas: 12            # depois disso a previsão é marcada como DESATUALIZADA
    atualizacao-automatica: ${PREVISAO_ATUALIZACAO_AUTOMATICA:true}
    atualizacao-minutos: 180      # intervalo do job que atualiza todas as fazendas com coordenadas
    intervalo-minimo-manual-minutos: 5   # evita chamadas seguidas pelo endpoint de atualização
  estacao:
    # Estação virtual: leituras horárias (EXTERNA) do Open-Meteo para as coordenadas da fazenda.
    atualizacao-automatica: ${ESTACAO_ATUALIZACAO_AUTOMATICA:true}
    atualizacao-minutos: 60
    historico-inicial-horas: 72          # histórico carregado quando a estação é criada
    recuperacao-maxima-horas: 168        # lacunas maiores que isto não são recuperadas
    intervalo-minimo-manual-minutos: 5   # evita chamadas seguidas pelo endpoint de sincronização
  admin:
    nome: ${ADMIN_NOME:Administrador}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
